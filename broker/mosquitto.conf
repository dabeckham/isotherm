# Isotherm local MQTT broker.
# This broker is internal to the compose network and is NOT published to the
# host by default. If you expose it, add authentication (password_file) before
# putting it on any reachable network.

persistence true
persistence_location /mosquitto/data/

# rtl_433 and the ingest bridge talk over plain TCP inside the docker network.
listener 1883
allow_anonymous true

# WebSockets listener for the browser dashboard's live sensor feed.
listener 9001
protocol websockets
allow_anonymous true
